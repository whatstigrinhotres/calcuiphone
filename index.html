<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Calculadora inspirada na calculadora do iPhone.">
  <title>Calculadora — CALCUIPHONE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --number: #333334;
      --utility: #a5a5a5;
      --orange: #ff9f0a;
      --gap: clamp(9px, 1.95vw, 17px);
      --side: clamp(18px, 3.75vw, 32px);
      --button-size: min(calc((100vw - 2 * var(--side) - 3 * var(--gap)) / 4), 21.2vw, 112px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--bg); }
    body {
      min-height: 100svh;
      min-height: 100dvh;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .app {
      min-height: 100svh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(env(safe-area-inset-top), 14px) var(--side) max(env(safe-area-inset-bottom), 22px);
      max-width: 560px;
      margin: 0 auto;
    }
    .topbar { height: 64px; display: flex; justify-content: space-between; align-items: flex-start; }
    .round-tool {
      width: 54px; height: 54px; border-radius: 50%; border: 1px solid #292929;
      background: radial-gradient(circle at 35% 25%, #292929, #151515 75%);
      color: #f5f5f7; display: grid; place-items: center; cursor: pointer;
      box-shadow: 0 1px 2px #5555, inset 0 1px 1px #ffffff12;
    }
    .round-tool svg { width: 27px; height: 27px; }
    .display {
      flex: 1 1 auto; min-height: 170px; display: flex; flex-direction: column;
      justify-content: flex-end; align-items: flex-end; padding: 0 5px 28px;
      overflow: hidden;
    }
    .expression {
      width: 100%; min-height: 1.2em; text-align: right; color: #fff;
      font-size: clamp(48px, 16.5vw, 82px); line-height: 1.12; font-weight: 300;
      letter-spacing: -3px; white-space: nowrap; overflow: hidden; text-overflow: clip;
      font-variant-numeric: lining-nums;
    }
    .expression.compact { font-size: clamp(38px, 12vw, 65px); }
    .subline { height: 24px; font-size: 17px; color: #8b8b8d; text-align: right; }
    .keypad {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: var(--gap); justify-items: center; align-items: center;
      padding-bottom: 2px;
    }
    .key {
      width: var(--button-size); height: var(--button-size); max-width: 100%;
      border: 0; border-radius: 50%; color: #fff; background: var(--number);
      display: grid; place-items: center; font: 400 clamp(32px, 9vw, 48px)/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      cursor: pointer; padding: 0; transition: filter .08s, transform .08s;
      box-shadow: inset 0 1px 1px #ffffff0c, 0 1px 1px #ffffff12;
    }
    .key:active { filter: brightness(1.35); transform: scale(.96); }
    .key.utility { background: var(--utility); color: #fff; font-weight: 400; }
    .key.operator { background: var(--orange); color: white; font-size: clamp(38px, 10vw, 55px); font-weight: 300; }
    .key.operator.selected { background: #fff; color: var(--orange); }
    .key.utility svg { width: 43%; height: 43%; }
    .key.zero { }
    .history-panel {
      position: fixed; z-index: 5; inset: 0; background: #000e; display: none;
      padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
    }
    .history-panel.open { display: flex; flex-direction: column; }
    .history-head { display: flex; justify-content: space-between; align-items: center; font-size: 21px; }
    .history-head button { background: none; color: var(--orange); border: 0; font: inherit; padding: 10px; }
    .history-list { overflow: auto; margin-top: 20px; }
    .history-item { padding: 15px 0; border-bottom: 1px solid #333; text-align: right; }
    .history-item small { color: #999; display: block; margin-bottom: 5px; }
    .history-item strong { font-size: 28px; font-weight: 400; }
    @media (max-height: 700px) {
      .topbar { height: 52px; }
      .round-tool { width: 46px; height: 46px; }
      .display { min-height: 105px; padding-bottom: 16px; }
      :root { --button-size: min(calc((100vw - 2 * var(--side) - 3 * var(--gap)) / 4), 17.5vh, 92px); }
    }
    @media (min-width: 600px) {
      .app { padding-left: 30px; padding-right: 30px; }
      :root { --button-size: 112px; --gap: 16px; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Calculadora">
    <header class="topbar">
      <button class="round-tool" id="historyButton" aria-label="Histórico" title="Histórico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l-3.5 2"/></svg>
      </button>
      <button class="round-tool" id="modeButton" aria-label="Calculadora padrão" title="Calculadora">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M8 6.5h8v3H8z" fill="currentColor" stroke="none"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01M8 20h.01M12 20h.01M16 20h.01" stroke-width="3.2"/></svg>
      </button>
    </header>
    <section class="display" aria-live="polite" aria-atomic="true">
      <div class="expression" id="display">0</div>
      <div class="subline" id="subline"></div>
    </section>
    <section class="keypad" aria-label="Teclado da calculadora">
      <button class="key utility" data-action="backspace" aria-label="Apagar último dígito">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7H33a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3H15L3 20z"/><path d="m17 14 10 12m0-12L17 26"/></svg>
      </button>
      <button class="key utility" data-action="clear">C</button>
      <button class="key utility" data-action="percent">%</button>
      <button class="key operator" data-op="÷">÷</button>
      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key operator" data-op="×">×</button>
      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key operator" data-op="−">−</button>
      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key operator" data-op="+">+</button>
      <button class="key" data-action="sign">+/−</button>
      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-action="decimal">,</button>
      <button class="key operator" data-action="equals">=</button>
    </section>
  </main>
  <aside class="history-panel" id="historyPanel" aria-label="Histórico de cálculos">
    <div class="history-head"><span>Histórico</span><button id="closeHistory">Fechar</button></div>
    <div class="history-list" id="historyList"><p style="color:#888;text-align:center">Seus cálculos aparecerão aqui.</p></div>
  </aside>
  <script>
    (() => {
      const display = document.getElementById('display');
      const subline = document.getElementById('subline');
      const historyPanel = document.getElementById('historyPanel');
      const historyList = document.getElementById('historyList');
      let current = '0', previous = null, operator = null, waiting = false, expression = '', justEvaluated = false;
      const history = [];
      const pretty = value => String(value).replace('.', ',');
      const number = () => Number(current.replace(',', '.'));
      const format = value => {
        if (!Number.isFinite(value)) return 'Erro';
        const rounded = Number.parseFloat(value.toPrecision(11));
        return String(rounded).replace('.', ',');
      };
      function render() {
        const shown = expression ? expression + (waiting ? '' : ' ' + current) : current;
        display.textContent = shown;
        display.classList.toggle('compact', shown.length > 8);
        document.querySelectorAll('[data-op]').forEach(b => b.classList.toggle('selected', !waiting && operator === b.dataset.op));
        document.querySelector('[data-action="clear"]').textContent = current === '0' && !expression ? 'C' : 'C';
      }
      function clear() { current='0'; previous=null; operator=null; waiting=false; expression=''; justEvaluated=false; subline.textContent=''; render(); }
      function inputDigit(d) {
        if (waiting || justEvaluated) { current=d; waiting=false; justEvaluated=false; expression=''; }
        else if (current.replace('-', '').replace(',', '').length < 12) current = current === '0' ? d : current + d;
        render();
      }
      function decimal() {
        if (waiting || justEvaluated) { current='0,'; waiting=false; justEvaluated=false; expression=''; }
        else if (!current.includes(',')) current += ',';
        render();
      }
      function calculate(a,b,op) {
        if (op === '+') return a+b;
        if (op === '−') return a-b;
        if (op === '×') return a*b;
        if (op === '÷') return b === 0 ? NaN : a/b;
        return b;
      }
      function chooseOperator(op) {
        const value=number();
        if (operator && !waiting) {
          const result=calculate(previous,value,operator);
          current=format(result); previous=Number(current.replace(',','.'));
        } else previous=value;
        operator=op; waiting=true; justEvaluated=false;
        expression = pretty(String(previous)) + ' ' + op;
        subline.textContent='';
        render();
      }
      function equals() {
        if (!operator || previous === null) return;
        const left=previous, right=number(), op=operator, result=calculate(left,right,op);
        const full = format(left) + ' ' + op + ' ' + pretty(String(right));
        current=format(result); expression=current; subline.textContent=full + ' =';
        history.unshift({expression:full,result:current});
        operator=null; previous=null; waiting=true; justEvaluated=true; render();
      }
      function percent() {
        current=format(number()/100); render();
      }
      function sign() { if (current !== '0') current=current.startsWith('-') ? current.slice(1) : '-'+current; render(); }
      function backspace() {
        if (waiting || justEvaluated) { current='0'; waiting=false; justEvaluated=false; expression=''; }
        else current=current.length <= 1 || (current.length===2 && current.startsWith('-')) ? '0' : current.slice(0,-1);
        render();
      }
      document.querySelector('.keypad').addEventListener('click', e => {
        const b=e.target.closest('button'); if (!b) return;
        if (b.dataset.digit !== undefined) inputDigit(b.dataset.digit);
        else if (b.dataset.op) chooseOperator(b.dataset.op);
        else switch(b.dataset.action) {
          case 'clear': clear(); break;
          case 'decimal': decimal(); break;
          case 'equals': equals(); break;
          case 'percent': percent(); break;
          case 'sign': sign(); break;
          case 'backspace': backspace(); break;
        }
      });
      document.getElementById('historyButton').addEventListener('click', () => {
        historyList.innerHTML = history.length ? history.map(item => '<div class="history-item"><small>'+item.expression.replace(/&/g,'&amp;').replace(/</g,'&lt;')+' =</small><strong>'+item.result+'</strong></div>').join('') : '<p style="color:#888;text-align:center">Seus cálculos aparecerão aqui.</p>';
        historyPanel.classList.add('open');
      });
      document.getElementById('closeHistory').addEventListener('click', () => historyPanel.classList.remove('open'));
      document.getElementById('modeButton').addEventListener('click', () => { subline.textContent='Calculadora padrão'; setTimeout(()=>{ if(subline.textContent==='Calculadora padrão') subline.textContent=''; },1300); });
      window.addEventListener('keydown', e => {
        if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
        else if (e.key==='.' || e.key===',') decimal();
        else if (e.key==='+') chooseOperator('+');
        else if (e.key==='-') chooseOperator('−');
        else if (e.key==='*') chooseOperator('×');
        else if (e.key==='/') { e.preventDefault(); chooseOperator('÷'); }
        else if (e.key==='Enter' || e.key==='=') equals();
        else if (e.key==='Backspace') backspace();
        else if (e.key==='Escape') clear();
        else if (e.key==='%') percent();
      });
      render();
    })();
  </script>
</body>
</html>
